[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "star-escrow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = "0.11"
sha2 = "0.10"
hex = "0.4"
stellar-strkey = "0.0.9"
ed25519-dalek = "2"
rand = "0.8"
base64 = "0.22"
chrono = "0.4"
# Issue #142: secure secret key storage via OS keychain
keyring = "2"
# Issue #143: direct Soroban RPC calls
reqwest = { version = "0.11", features = ["json", "blocking"] }
# Issue #144: XDR encoding/decoding
stellar-xdr = { version = "21", features = ["curr"] }
# Issue #149: tabular CLI output
tabled = "0.14"

[dev-dependencies]
tempfile = "3"
